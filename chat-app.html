<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Tour Chat App</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        /* Login Screen */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 400px;
        }

        .login-box h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* Chat App */
        .chat-app {
            display: none;
            height: 100vh;
            background: white;
        }

        .chat-container {
            display: flex;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 350px;
            background: #f8f9fa;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .sidebar-header h2 {
            margin-bottom: 5px;
        }

        .sidebar-header .user-info {
            font-size: 14px;
            opacity: 0.9;
        }

        .sidebar-header .logout-btn {
            margin-top: 10px;
            padding: 8px 15px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .sidebar-header .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* User Search */
        .user-search {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            position: relative;
        }

        .search-input-wrapper {
            position: relative;
        }

        .user-search input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .user-search input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #6c757d;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 15px;
            right: 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .search-results.show {
            display: block;
        }

        .search-result-item {
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: #f8f9fa;
        }

        .search-result-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .search-result-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .search-result-info {
            flex: 1;
        }

        .search-result-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .search-result-email {
            font-size: 12px;
            color: #6c757d;
        }

        .no-results {
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        /* Conversation List */
        .conversation-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 15px 20px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            position: relative;
        }

        .conversation-item:hover {
            background: #e9ecef;
        }

        .conversation-item:hover .delete-conversation-btn {
            opacity: 1;
        }

        .conversation-item.active {
            background: #e3f2fd;
            border-left: 3px solid #667eea;
        }

        .delete-conversation-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s;
            font-size: 14px;
            z-index: 10;
        }

        .delete-conversation-btn:hover {
            background: #c82333;
            transform: translateY(-50%) scale(1.1);
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .conversation-details {
            flex: 1;
            overflow: hidden;
        }

        .conversation-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .user-name {
            font-weight: 600;
            color: #333;
        }

        .conversation-time {
            font-size: 11px;
            color: #6c757d;
        }

        .last-message {
            font-size: 13px;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: #dc3545;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
        }

        .empty-conversations {
            padding: 40px 20px;
            text-align: center;
            color: #6c757d;
        }

        .empty-conversations-icon {
            font-size: 60px;
            opacity: 0.3;
            margin-bottom: 15px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
        }

        .chat-header .user-avatar {
            margin-right: 15px;
        }

        .chat-status {
            font-size: 12px;
            color: #28a745;
            font-weight: 500;
        }

        .chat-status.disconnected {
            color: #6c757d;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.mine {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 15px;
            position: relative;
        }

        .message.other .message-content {
            background: white;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .message.mine .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message-sender {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .message-text {
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message-time {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.7;
        }

        .message-file {
            margin-top: 8px;
            padding: 10px;
            background: rgba(0,0,0,0.1);
            border-radius: 8px;
            cursor: pointer;
        }

        .message.mine .message-file {
            background: rgba(255,255,255,0.2);
        }

        .message-file a {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .message-file-icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .message-image {
            margin-top: 8px;
            max-width: 100%;
            border-radius: 8px;
            cursor: pointer;
        }

        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
        }

        .empty-chat-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        /* Chat Input */
        .chat-input {
            padding: 20px;
            background: white;
            border-top: 2px solid #e9ecef;
            display: none;
        }

        .chat-input.show {
            display: block;
        }

        .chat-input-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
            max-height: 100px;
        }

        .chat-input textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #f8f9fa;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }

        .icon-btn:hover {
            background: #e9ecef;
            transform: scale(1.1);
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        .file-preview {
            padding: 10px;
            background: #e3f2fd;
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }

        .file-preview.show {
            display: flex;
        }

        .file-preview-info {
            display: flex;
            align-items: center;
        }

        .file-preview-icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .file-preview-name {
            font-size: 14px;
            font-weight: 500;
        }

        .remove-file-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }

        .loading.show {
            display: block;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Hidden file input */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>🔥 Food Tour Chat</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Nhập email của bạn">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" class="btn">Đăng Nhập</button>
                <div class="error-message" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- Chat App -->
    <div class="chat-app" id="chatApp">
        <div class="chat-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>Messages</h2>
                    <div class="user-info" id="currentUserInfo"></div>
                    <button class="logout-btn" onclick="logout()">Đăng Xuất</button>
                </div>

                <!-- User Search -->
                <div class="user-search">
                    <div class="search-input-wrapper">
                        <input type="text" id="userSearch" placeholder="🔍 Tìm kiếm email hoặc tên người dùng...">
                        <span class="search-icon">🔍</span>
                    </div>
                    <div class="search-results" id="searchResults"></div>
                </div>

                <!-- Conversation List -->
                <div class="conversation-list" id="conversationList">
                    <div class="empty-conversations">
                        <div class="empty-conversations-icon">💬</div>
                        <p><strong>Chưa có cuộc trò chuyện nào</strong></p>
                        <p style="font-size: 13px; margin-top: 5px;">Tìm kiếm email để bắt đầu chat</p>
                    </div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area">
                <div class="chat-header" id="chatHeader" style="display: none;">
                    <div class="chat-header-left">
                        <div class="user-avatar" id="chatAvatar">U</div>
                        <div>
                            <div class="user-name" id="chatUserName">Chọn người để chat</div>
                            <div class="chat-status" id="chatStatus">Offline</div>
                        </div>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="empty-chat">
                        <div class="empty-chat-icon">💬</div>
                        <h3>Chào mừng đến với Food Tour Chat!</h3>
                        <p>Tìm kiếm email người dùng để bắt đầu trò chuyện</p>
                    </div>
                </div>

                <div class="chat-input" id="chatInput">
                    <div class="file-preview" id="filePreview">
                        <div class="file-preview-info">
                            <span class="file-preview-icon" id="filePreviewIcon">📎</span>
                            <span class="file-preview-name" id="filePreviewName"></span>
                        </div>
                        <button class="remove-file-btn" onclick="removeFile()">✕</button>
                    </div>
                    <div class="chat-input-container">
                        <textarea id="messageInput" placeholder="Nhập tin nhắn..." rows="1"></textarea>
                        <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt" onchange="handleFileSelect(event)">
                        <div class="input-actions">
                            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Đính kèm file">📎</button>
                            <button class="icon-btn send-btn" onclick="sendMessage()" title="Gửi tin nhắn">📤</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentUser = null;
        let authToken = null;
        let stompClient = null;
        let currentConversation = null;
        let selectedUser = null;
        let conversations = [];
        let selectedFile = null;
        let searchTimeout = null;

        const API_BASE = 'http://localhost:8080';

        // Helper function to make authenticated requests
        async function authenticatedFetch(url, options = {}) {
            if (!authToken) {
                console.error('No auth token available for request');
                throw new Error('Not authenticated');
            }

            // Ensure headers object exists
            if (!options.headers) {
                options.headers = {};
            }

            // Always add Authorization header
            options.headers['Authorization'] = `Bearer ${authToken}`;

            // Always add Content-Type if not specified
            if (!options.headers['Content-Type']) {
                options.headers['Content-Type'] = 'application/json';
            }

            console.log('Making authenticated request to:', url);
            console.log('Headers:', options.headers);

            return await fetch(url, options);
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                console.log('Login response:', data);

                if (data.success && data.accessToken) {
                    // Set token and user FIRST
                    authToken = data.accessToken;
                    currentUser = data.user;

                    // Then save to localStorage
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));

                    console.log('=== Token set successfully ===');
                    console.log('authToken:', authToken);
                    console.log('currentUser:', currentUser);

                    // Show chat app with delay to ensure everything is ready
                    setTimeout(async () => {
                        await showChatApp();
                    }, 100);
                } else if (data.requires2FA) {
                    showError('2FA được bật. Vui lòng đăng nhập qua app chính.');
                } else {
                    showError(data.message || 'Đăng nhập thất bại');
                }
            } catch (error) {
                showError('Lỗi kết nối server');
                console.error('Login error:', error);
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        async function showChatApp() {
            console.log('=== showChatApp START ===');
            console.log('authToken:', authToken);
            console.log('currentUser:', currentUser);

            if (!authToken || !currentUser) {
                console.error('Missing authToken or currentUser!');
                showError('Lỗi đăng nhập. Vui lòng thử lại.');
                return;
            }

            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('chatApp').style.display = 'block';

            document.getElementById('currentUserInfo').textContent =
                `${currentUser.fullName} (${currentUser.email})`;

            // Load conversations first, then connect WebSocket
            await loadConversations();
            connectWebSocket();

            console.log('=== showChatApp END ===');
        }

        // Load conversations
        async function loadConversations() {
            console.log('=== loadConversations START ===');
            console.log('authToken:', authToken);

            if (!authToken) {
                console.error('No auth token available in loadConversations');
                return;
            }

            try {
                console.log('Making request to /api/user/chat/conversations with token:', authToken.substring(0, 20) + '...');

                const response = await fetch(`${API_BASE}/api/user/chat/conversations`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                const data = await response.json();
                console.log('Response data:', data);

                if (data.success) {
                    conversations = data.data;
                    renderConversations();
                } else {
                    console.error('Failed to load conversations:', data.message);
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
            }

            console.log('=== loadConversations END ===');
        }

        function renderConversations() {
            const conversationList = document.getElementById('conversationList');

            if (conversations.length === 0) {
                conversationList.innerHTML = `
                    <div class="empty-conversations">
                        <div class="empty-conversations-icon">💬</div>
                        <p><strong>Chưa có cuộc trò chuyện nào</strong></p>
                        <p style="font-size: 13px; margin-top: 5px;">Tìm kiếm email để bắt đầu chat</p>
                    </div>
                `;
                return;
            }

            conversationList.innerHTML = conversations.map(conv => {
                const otherUser = conv.participants.find(p => p.id !== currentUser.id);
                return `
                    <div class="conversation-item ${currentConversation && currentConversation.id === conv.id ? 'active' : ''}"
                         onclick="selectConversation(${conv.id})">
                        <div class="user-avatar">
                            ${otherUser.avatarUrl ?
                                `<img src="${API_BASE}${otherUser.avatarUrl}" alt="${otherUser.fullName}">` :
                                otherUser.fullName.charAt(0).toUpperCase()
                            }
                        </div>
                        <div class="conversation-details">
                            <div class="conversation-top">
                                <div class="user-name">${otherUser.fullName}</div>
                                <div class="conversation-time">${conv.lastMessageAt ? formatTime(conv.lastMessageAt) : ''}</div>
                            </div>
                            <div class="last-message">
                                ${conv.lastMessage || 'Bắt đầu cuộc trò chuyện'}
                                ${conv.unreadCount > 0 ? `<span class="unread-badge">${conv.unreadCount}</span>` : ''}
                            </div>
                        </div>
                        <button class="delete-conversation-btn" onclick="deleteConversation(event, ${conv.id})">🗑️</button>
                    </div>
                `;
            }).join('');
        }

        // User search with debounce
        document.getElementById('userSearch').addEventListener('input', (e) => {
            const keyword = e.target.value.trim();

            clearTimeout(searchTimeout);

            if (!keyword) {
                document.getElementById('searchResults').classList.remove('show');
                return;
            }

            searchTimeout = setTimeout(() => {
                searchUsers(keyword);
            }, 300);
        });

        async function searchUsers(keyword) {
            console.log('=== searchUsers START ===');
            console.log('Keyword:', keyword);
            console.log('authToken:', authToken ? authToken.substring(0, 20) + '...' : 'NO TOKEN');

            if (!authToken) {
                console.error('No auth token available for search');
                return;
            }

            try {
                const url = `${API_BASE}/api/user/chat/users?keyword=${encodeURIComponent(keyword)}`;

                // Use authenticatedFetch helper instead of direct fetch
                const response = await authenticatedFetch(url, {
                    method: 'GET'
                });

                console.log('Search response status:', response.status);

                const data = await response.json();
                console.log('Search response data:', data);

                if (data.success) {
                    renderSearchResults(data.data);
                } else {
                    console.error('Search failed:', data.message);
                    renderSearchResults([]);
                }
            } catch (error) {
                console.error('Error searching users:', error);
                renderSearchResults([]);
            }

            console.log('=== searchUsers END ===');
        }

        function renderSearchResults(users) {
            const searchResults = document.getElementById('searchResults');

            if (users.length === 0) {
                searchResults.innerHTML = '<div class="no-results">Không tìm thấy người dùng</div>';
                searchResults.classList.add('show');
                return;
            }

            searchResults.innerHTML = users.map(user => `
                <div class="search-result-item" onclick="selectUserFromSearch(${user.id}, '${user.fullName}', '${user.avatarUrl || ''}', '${user.email}')">
                    <div class="search-result-avatar">
                        ${user.avatarUrl ?
                            `<img src="${API_BASE}${user.avatarUrl}" alt="${user.fullName}">` :
                            user.fullName.charAt(0).toUpperCase()
                        }
                    </div>
                    <div class="search-result-info">
                        <div class="search-result-name">${user.fullName}</div>
                        <div class="search-result-email">${user.email}</div>
                    </div>
                </div>
            `).join('');

            searchResults.classList.add('show');
        }

        // Close search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-search')) {
                document.getElementById('searchResults').classList.remove('show');
            }
        });

        // Select user from search results
        async function selectUserFromSearch(userId, fullName, avatarUrl, email) {
            // Hide search results
            document.getElementById('searchResults').classList.remove('show');
            document.getElementById('userSearch').value = '';

            // Create or get conversation
            try {
                const response = await fetch(`${API_BASE}/api/user/chat/conversations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ otherUserId: userId })
                });

                const data = await response.json();

                if (data.success) {
                    currentConversation = data.data;
                    selectedUser = { id: userId, fullName, avatarUrl, email };

                    // Reload conversations to include new one
                    await loadConversations();

                    // Show chat interface
                    showChatInterface();

                    // Load messages
                    await loadMessages();
                }
            } catch (error) {
                console.error('Error creating conversation:', error);
                alert('Lỗi tạo cuộc trò chuyện');
            }
        }

        // Select conversation from list
        async function selectConversation(conversationId) {
            const conv = conversations.find(c => c.id === conversationId);
            if (!conv) return;

            currentConversation = conv;
            selectedUser = conv.participants.find(p => p.id !== currentUser.id);

            renderConversations(); // Update active state
            showChatInterface();
            await loadMessages();
        }

        function showChatInterface() {
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('chatInput').classList.add('show');

            document.getElementById('chatAvatar').innerHTML = selectedUser.avatarUrl ?
                `<img src="${API_BASE}${selectedUser.avatarUrl}" alt="${selectedUser.fullName}">` :
                selectedUser.fullName.charAt(0).toUpperCase();

            document.getElementById('chatUserName').textContent = selectedUser.fullName;

            // Subscribe to this conversation via WebSocket
            if (stompClient && stompClient.connected) {
                stompClient.subscribe(`/topic/conversation/${currentConversation.id}`, (message) => {
                    const newMessage = JSON.parse(message.body);
                    displayMessage(newMessage);
                    scrollToBottom();

                    // Reload conversations để update last message
                    loadConversations();
                });
            }
        }

        async function loadMessages() {
            if (!currentConversation) return;

            try {
                const response = await fetch(
                    `${API_BASE}/api/user/chat/conversations/${currentConversation.id}/messages?page=0&size=50`,
                    {
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        }
                    }
                );

                const data = await response.json();

                if (data.success) {
                    const messagesContainer = document.getElementById('chatMessages');
                    messagesContainer.innerHTML = '';

                    data.data.reverse().forEach(msg => {
                        displayMessage(msg, false);
                    });

                    scrollToBottom();
                    markAsRead();
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        function displayMessage(message, animate = true) {
            const messagesContainer = document.getElementById('chatMessages');
            const isMine = message.senderId === currentUser.id;

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isMine ? 'mine' : 'other'}`;
            if (!animate) messageDiv.style.animation = 'none';

            let contentHtml = '';

            if (message.messageType === 'TEXT') {
                contentHtml = `<div class="message-text">${escapeHtml(message.content)}</div>`;
            } else if (message.messageType === 'IMAGE') {
                contentHtml = `
                    <div class="message-text">📷 Hình ảnh</div>
                    <img src="${API_BASE}${message.content}" class="message-image"
                         onclick="window.open('${API_BASE}${message.content}', '_blank')">
                `;
            } else if (message.messageType === 'FILE') {
                const fileName = message.content.split('/').pop();
                contentHtml = `
                    <div class="message-text">📎 File đính kèm</div>
                    <div class="message-file">
                        <a href="${API_BASE}${message.content}" target="_blank" download>
                            <span class="message-file-icon">📄</span>
                            <span>${fileName}</span>
                        </a>
                    </div>
                `;
            }

            messageDiv.innerHTML = `
                <div class="message-content">
                    ${!isMine ? `<div class="message-sender">${message.senderName}</div>` : ''}
                    ${contentHtml}
                    <div class="message-time">${formatTime(message.createdAt)}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
        }

        // WebSocket
        function connectWebSocket() {
            console.log('Connecting to WebSocket with token:', authToken ? authToken.substring(0, 20) + '...' : 'NO TOKEN');

            // SockJS doesn't support custom headers, so we pass token via query parameter
            const socket = new SockJS(`${API_BASE}/ws?token=${encodeURIComponent(authToken)}`);
            stompClient = StompJs.Stomp.over(socket);

            // Configure STOMP to send token in headers
            const connectHeaders = {
                'Authorization': `Bearer ${authToken}`,
                'token': authToken  // Backup header
            };

            console.log('STOMP connect headers:', connectHeaders);

            stompClient.connect(
                connectHeaders,
                (frame) => {
                    console.log('WebSocket connected successfully');
                    console.log('Frame:', frame);
                    document.getElementById('chatStatus').textContent = 'Online';
                    document.getElementById('chatStatus').classList.remove('disconnected');

                    // Subscribe to personal notifications
                    stompClient.subscribe('/user/queue/messages', (notification) => {
                        const data = JSON.parse(notification.body);
                        console.log('New message notification:', data);

                        // Reload conversations
                        loadConversations();

                        // Show notification if not in current conversation
                        if (!currentConversation || data.conversationId !== currentConversation.id) {
                            showNotification(data.senderName, data.content);
                        }
                    });
                },
                (error) => {
                    console.error('WebSocket error:', error);
                    document.getElementById('chatStatus').textContent = 'Offline';
                    document.getElementById('chatStatus').classList.add('disconnected');
                }
            );
        }

        // Send message
        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const content = messageInput.value.trim();

            if (!content && !selectedFile) {
                return;
            }

            if (!currentConversation) {
                alert('Vui lòng chọn người để chat');
                return;
            }

            let messageContent = content;
            let messageType = 'TEXT';

            // Upload file first if exists
            if (selectedFile) {
                try {
                    const fileUrl = await uploadFile(selectedFile);
                    messageContent = fileUrl;

                    if (selectedFile.type.startsWith('image/')) {
                        messageType = 'IMAGE';
                    } else {
                        messageType = 'FILE';
                    }
                } catch (error) {
                    alert('Lỗi upload file');
                    return;
                }
            }

            const message = {
                conversationId: currentConversation.id,
                content: messageContent,
                messageType: messageType
            };

            // Send via WebSocket
            if (stompClient && stompClient.connected) {
                stompClient.send('/app/chat.send', {}, JSON.stringify(message));
                messageInput.value = '';
                removeFile();
                messageInput.focus();
            } else {
                alert('Chưa kết nối WebSocket');
            }
        }

        // File handling
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFile = file;

            const preview = document.getElementById('filePreview');
            const fileName = document.getElementById('filePreviewName');
            const fileIcon = document.getElementById('filePreviewIcon');

            fileName.textContent = file.name;

            if (file.type.startsWith('image/')) {
                fileIcon.textContent = '🖼️';
            } else {
                fileIcon.textContent = '📄';
            }

            preview.classList.add('show');
        }

        function removeFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreview').classList.remove('show');
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            const response = await fetch(`${API_BASE}/api/user/chat/upload`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${authToken}`
                },
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                return data.fileUrl;
            } else {
                throw new Error(data.message);
            }
        }

        async function markAsRead() {
            if (!currentConversation) return;

            try {
                await fetch(`${API_BASE}/api/user/chat/conversations/${currentConversation.id}/read`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                // Reload conversations để update unread count
                loadConversations();
            } catch (error) {
                console.error('Error marking as read:', error);
            }
        }

        // Delete conversation
        async function deleteConversation(event, conversationId) {
            event.stopPropagation(); // Ngăn không cho trigger selectConversation

            if (!confirm('Bạn có chắc muốn xóa cuộc trò chuyện này? Tất cả tin nhắn sẽ bị xóa vĩnh viễn.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/user/chat/conversations/${conversationId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    // Nếu đang xem conversation này thì clear chat area
                    if (currentConversation && currentConversation.id === conversationId) {
                        currentConversation = null;
                        selectedUser = null;
                        document.getElementById('chatHeader').style.display = 'none';
                        document.getElementById('chatInput').classList.remove('show');
                        document.getElementById('chatMessages').innerHTML = `
                            <div class="empty-chat">
                                <div class="empty-chat-icon">💬</div>
                                <h3>Chào mừng đến với Food Tour Chat!</h3>
                                <p>Tìm kiếm email người dùng để bắt đầu trò chuyện</p>
                            </div>
                        `;
                    }

                    // Reload conversations
                    await loadConversations();

                    alert('Đã xóa cuộc trò chuyện thành công');
                } else {
                    alert(data.message || 'Lỗi khi xóa cuộc trò chuyện');
                }
            } catch (error) {
                console.error('Error deleting conversation:', error);
                alert('Lỗi khi xóa cuộc trò chuyện');
            }
        }

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const oneDay = 24 * 60 * 60 * 1000;

            if (diff < oneDay && date.getDate() === now.getDate()) {
                return date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            } else if (diff < 2 * oneDay) {
                return 'Hôm qua';
            } else if (diff < 7 * oneDay) {
                return date.toLocaleDateString('vi-VN', { weekday: 'short' });
            } else {
                return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });
            }
        }

        function scrollToBottom() {
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showNotification(title, message) {
            if (Notification.permission === 'granted') {
                new Notification(title, {
                    body: message,
                    icon: '/logo.png'
                });
            }
        }

        function logout() {
            if (stompClient) {
                stompClient.disconnect();
            }
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            location.reload();
        }

        // Enter to send
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Request notification permission
        if (Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Check if already logged in
        window.onload = () => {
            const savedToken = localStorage.getItem('authToken');
            const savedUser = localStorage.getItem('currentUser');

            if (savedToken && savedUser) {
                authToken = savedToken;
                currentUser = JSON.parse(savedUser);
                showChatApp();
            }
        };
    </script>
</body>
</html>
