spring.application.name=FoodTourApp

# Database Configuration - MySQL with Docker
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:food_tour_app}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging Configuration
logging.level.com.example.FoodTourApp=INFO

# HERE Platform API Configuration
here.api.key=${HERE_API_KEY}

# File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Static Resource Configuration - Serve uploaded files
spring.web.resources.static-locations=classpath:/static/,file:${FILE_UPLOAD_DIR:uploads}/

# MOMO Payment Configuration (UAT Environment)
momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
momo.endpoint=${MOMO_ENDPOINT}
momo.return-url=${MOMO_RETURN_URL}
momo.notify-url=${MOMO_NOTIFY_URL}

# Application Configuration
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Firebase Configuration for Push Notifications
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-adminsdk-57qi4-1e18cf1a46.json}

# Elasticsearch
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.index=foodtour_vector_index

# RAG Configuration
rag.max-results=5
rag.min-score=0.7

# Ollama
ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text
ollama.chat-model=qwen2.5:1.5b
