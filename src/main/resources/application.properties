spring.application.name=FoodTourApp

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.example.FoodTourApp=INFO

# HERE API
here.api.key=${HERE_API_KEY}

# File Upload
file.upload-dir=${FILE_UPLOAD_DIR}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
spring.web.resources.static-locations=classpath:/static/,file:${FILE_UPLOAD_DIR}/

# MOMO Payment
momo.partner-code=${MOMO_PARTNER_CODE}
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
momo.endpoint=${MOMO_ENDPOINT}
momo.return-url=${APP_BASE_URL}/api/public/momo/callback
momo.notify-url=${APP_BASE_URL}/api/public/momo/ipn

# App
app.base-url=${APP_BASE_URL}

# Firebase
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH}

# Elasticsearch
elasticsearch.host=${ES_HOST}
elasticsearch.port=${ES_PORT}
elasticsearch.index=${ES_CHATBOT_INDEX}
elasticsearch.search-index=${ES_SEARCH_INDEX}
elasticsearch.suggestion-index=${ES_SUGGESTION_INDEX}
elasticsearch.analytics-index=${ES_ANALYTICS_INDEX}
elasticsearch.recommend-index=${ES_RECOMMEND_INDEX}

# RAG
rag.max-results=${RAG_MAX_RESULTS}
rag.min-score=${RAG_MIN_SCORE}

# Face Authentication
face.model.arcface.path=${FACE_MODEL_ARCFACE_PATH}
face.model.antispoofing.path=${FACE_MODEL_ANTISPOOF_PATH}
face.model.headpose.path=${FACE_MODEL_HEADPOSE_PATH}
face.model.yunet.path=${FACE_MODEL_YUNET_PATH}
face.liveness.threshold=${FACE_LIVENESS_THRESHOLD}

# Google Gemini API
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL}

# Python sync scripts
app.python-sync-script=${PYTHON_CHATBOT_SYNC_SCRIPT}
app.python-search-sync-script=${PYTHON_SEARCH_SYNC_SCRIPT}
app.python-suggestion-sync-script=${PYTHON_SUGGESTION_SYNC_SCRIPT}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# PhoBERT
phobert.server-url=${PHOBERT_SERVER_URL}
phobert.enabled=${PHOBERT_ENABLED}

# Hybrid Search Weights
search.hybrid.bm25-weight=${SEARCH_BM25_WEIGHT}
search.hybrid.semantic-weight=${SEARCH_SEMANTIC_WEIGHT}

# Message Encryption (AES-256-GCM)
encryption.secret-key=${ENCRYPTION_SECRET_KEY}
